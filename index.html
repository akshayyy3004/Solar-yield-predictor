<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Yield AI Dashboard</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>
    <div class="dashboard-container">
    
        <div class="info-panel">
            <h2>Model Training Insights</h2>
            
            <div class="input-group">
                <label for="model-selector" style="color: #1abc9c;"><strong>Select AI Algorithm:</strong></label>
                <select id="model-selector" style="width: 100%; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                    <option value="gb">Gradient Boosting (Recommended)</option>
                    <option value="rf">Random Forest</option>
                    <option value="svr">Support Vector Regressor (SVR)</option>
                </select>
            </div>

            <div class="metrics-box">
                <p><strong>R² Accuracy:</strong> <span id="r2-score" class="highlight">88.42%</span></p>
                <p><strong>Mean Absolute Error:</strong> <span id="mae-score" style="font-weight: bold; color: #e74c3c;">152.4 kWh</span></p>
            </div>
            
            <div class="graph-box">
                <p><strong>Actual vs Predicted Accuracy:</strong></p>
                <img src="static/gb_scatter.png" alt="Scatter Plot" id="scatter-graph" style="width: 100%; border-radius: 4px; margin-bottom: 15px;">
                
                <p><strong>Training vs Validation Error (Learning Curve):</strong></p>
                <img src="static/gb_learning_curve.png" alt="Learning Curve" id="learning-curve-graph" style="width: 100%; border-radius: 4px;">
            </div>
        </div>

        <div class="action-panel">
            <h2>Live Predictor</h2>
            <p>Enter current weather parameters to test the model.</p>
            
            <form id="prediction-form">
                <div class="input-group">
                    <label>Ambient Temperature (°C)</label>
                    <input type="number" id="ambient_temp" step="any" required placeholder="e.g. 25.5">
                </div>
                
                <div class="input-group">
                    <label>Module Temperature (°C)</label>
                    <input type="number" id="module_temp" step="any" required placeholder="e.g. 40.2">
                </div>
                
                <div class="input-group">
                    <label>Irradiation (kW/m²)</label>
                    <input type="number" id="irradiation" step="any" required placeholder="e.g. 0.85">
                </div>
                
                <button type="submit">Predict Yield</button>
            </form>

            <div id="result-box" style="display: none;">
                <h3>Predicted Power:</h3>
                <h1 id="yield-result">0.00 kWh</h1>
            </div>
        </div>

    </div>
    <script src="static/script.js"></script>
</body>
</html>
